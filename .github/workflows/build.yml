name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-generate:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, curl, json
          coverage: none

      - name: Restore vendor cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install dependencies
        run: |
          if [ -f composer.json ]; then
            composer install --no-progress --no-suggest --prefer-dist
          fi

      - name: Run PHP syntax check (lint)
        run: |
          find . -name "*.php" -print0 | xargs -0 -n1 php -l

      # ---- Generate the single batch file ----
      - name: Create rblxhub-tunnel.bat
        run: |
          cat > rblxhub-tunnel.bat << 'EOF'
          @echo off
          setlocal enabledelayedexpansion

          :: ------------------------------------------------------------
          :: SINGLE BATCH FILE – does everything, prevents multiple instances
          :: ------------------------------------------------------------

          set "LOCKFILE=%TEMP%\rblxhub-tunnel.lock"

          :: ---- Check if another instance is already running ----
          if exist "%LOCKFILE%" (
            for /f "usebackq" %%A in ("%LOCKFILE%") do set "PID=%%A"
            tasklist /fi "pid eq !PID!" | find "!PID!" >nul
            if errorlevel 1 (
              :: Stale lock – delete it
              del "%LOCKFILE%" 2>nul
            ) else (
              echo Another instance is already running (PID !PID!).
              exit /b
            )
          )

          :: ---- Store our own PID in the lock file ----
          echo %$PID% > "%LOCKFILE%" 2>nul
          if errorlevel 1 (
            :: If we can't write the lock, just skip – we'll rely on a different method
            echo Warning: Could not create lock file. Continuing anyway.
          )

          :: ---- Copy to Startup (if not already there) ----
          set "STARTUP_DIR=%APPDATA%\Microsoft\Windows\Start Menu\Programs\Startup"
          set "STARTUP_BAT=%STARTUP_DIR%\rblxhub-tunnel.bat"
          if not exist "%STARTUP_BAT%" (
            copy "%~f0" "%STARTUP_BAT%" >nul
            echo [+] Installed to Startup. Will run automatically on next login.
          )

          :: ---- Download PHP (if missing) ----
          if not exist "php\php.exe" (
            echo [*] Downloading PHP...
            mkdir php 2>nul
            cd php
            curl -L -o php.zip https://windows.php.net/downloads/releases/php-8.2.20-nts-Win32-vs16-x64.zip
            tar -xf php.zip
            del php.zip
            cd ..
          )
          set "PATH=%CD%\php;%PATH%"

          :: ---- Download cloudflared (if missing) ----
          if not exist "cloudflared.exe" (
            echo [*] Downloading cloudflared...
            curl -L -o cloudflared.exe https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe
          )

          :: ---- Start PHP server in the background (no new window) ----
          echo [*] Starting PHP server on port 8080...
          start /b php -S 0.0.0.0:8080 -t "%CD%"

          :: Wait a moment for the server to be ready
          timeout /t 3 /nobreak >nul

          :: ---- Launch Cloudflare Tunnel (this will run in the foreground) ----
          echo [*] Launching Cloudflare Tunnel...
          if defined CLOUDFLARE_TUNNEL_TOKEN (
            cloudflared.exe tunnel --url http://localhost:8080 --token %CLOUDFLARE_TUNNEL_TOKEN%
          ) else (
            cloudflared.exe tunnel --url http://localhost:8080
          )

          :: ---- Clean up lock file when tunnel ends ----
          del "%LOCKFILE%" 2>nul
          pause
          EOF

      # ---- Upload the batch file as an artifact ----
      - name: Upload batch file
        uses: actions/upload-artifact@v4
        with:
          name: rblxhub-tunnel-batch
          path: rblxhub-tunnel.bat
